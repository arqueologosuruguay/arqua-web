---
layout: base
---
<article class="contenedor angosto pagina">
  <p class="antetitulo"><a href="{{ '/posicionamientos/' | relative_url }}">Posicionamientos</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{% include fecha.html fecha=page.date %}</time></p>
  <div class="texto">
  {{ content }}
  </div>
  {% if page.pdf %}<p><a class="boton boton--oscuro" href="{{ page.pdf | relative_url }}">Descargar el documento (PDF)</a></p>{% endif %}
  {% if page.enlace %}<p><a href="{{ page.enlace }}">Ver la publicación original →</a></p>{% endif %}
</article>
