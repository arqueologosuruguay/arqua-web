---
layout: base
---
<article class="contenedor angosto pagina">
  <p class="antetitulo"><a href="{{ '/novedades/' | relative_url }}">Novedades</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta"><span class="etiqueta">{{ page.tipo }}</span> <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{% include fecha.html fecha=page.date texto=page.fecha_texto %}</time></p>
  {% if page.imagen %}<img class="destacada" src="{{ page.imagen | relative_url }}" alt="{{ page.imagen_texto | default: '' }}">{% endif %}
  <div class="texto">
  {{ content }}
  </div>
</article>
