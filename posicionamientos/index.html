title: Posicionamientos
bajada: Declaraciones públicas de Arqua.
---
<h2>Declaraciones</h2>
<ul class="lista-docs">
{% assign ds = site.declaraciones | sort: "date" | reverse %}
{% for d in ds %}
  <li><a href="{{ d.url | relative_url }}">{{ d.title }}</a> <time datetime="{{ d.date | date: '%Y-%m-%d' }}">{% include fecha.html fecha=d.date %}</time></li>
{% endfor %}
</ul>
