# Configuración del sitio de Arqua
title: "Arqua"
nombre: "Asociación de Arqueología del Uruguay"
nombre_registrado: "Arqueólogos de Uruguay Asociados"
description: "Asociación que nuclea a profesionales de la arqueología en Uruguay."
lang: es

# El sitio se publica en el dominio propio arqua.com.uy (ver el archivo CNAME).
url: "https://arqua.com.uy"
baseurl: ""

correo: "arqueologos.uruguay@gmail.com"
correo_tesoreria: "tesoreria.arqua@gmail.com"
instagram: "https://www.instagram.com/arqua.difusion/"
facebook: "https://www.facebook.com/profile.php?id=61583400462785"
youtube: "" # pegar acá el enlace del canal de YouTube

timezone: America/Montevideo
permalink: pretty

collections:
  novedades:
    output: true
    permalink: /novedades/:name/
  declaraciones:
    output: true
    permalink: /posicionamientos/:name/

defaults:
  - scope: { path: "" }
    values: { layout: pagina }
  - scope: { path: "", type: novedades }
    values: { layout: novedad }
  - scope: { path: "", type: declaraciones }
    values: { layout: declaracion }

exclude:
  - README.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
